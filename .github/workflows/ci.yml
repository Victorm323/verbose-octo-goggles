name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The oldest version package.json claims to support, and current.
        node: [18.20.4, 22.x]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm lint

      - run: pnpm test

      - name: Check formatting
        run: pnpm exec prettier --check nodes credentials src test

      # A cheap smoke test that the built CLI actually runs, which the unit tests
      # deliberately do not cover.
      - name: Run a short tournament
        run: node dist/src/cli/index.js simulate --matches 20 --seed 1
